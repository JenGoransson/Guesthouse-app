apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviewservice
  template:
    metadata:
      labels:
        app: reviewservice
    spec:
      containers:
        - name: reviewservice
          image: reviewservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://review-db:3306/reviewdb
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: BOOKING_SERVICE_URL
              value: http://booking-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: reviewservice
spec:
  selector:
    app: reviewservice
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082