services:

  booking-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookingdb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}


  booking-service:
    build: ./booking-service
    ports:
      - "8080:8080"
    depends_on:
      - booking-db

  review-db:
    image: mysql:8
    container_name: review-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reviewdb
    ports:
      - "3306:3306"
    restart: always

  review-service:
    container_name: review-service
    build: ReviewService
    ports:
      - "8082:8082"
    depends_on:
      - review-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://review-db:3306/reviewdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
